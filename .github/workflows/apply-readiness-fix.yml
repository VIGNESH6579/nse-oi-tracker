name: apply readiness and vwap fix

on:

  push:
  
    branches: [main]
    
    paths: ['.github/workflows/apply-readiness-fix.yml']
    
permissions:

  contents: write
  
jobs:

  patch:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - uses: actions/checkout@v4
      
      - name: Apply tested patch and commit
      
        run: |
        
          curl -fsSL https://8765-iiistfhqnh3fy3vqmem5m-3cdc6ffa.sg2.manus.computer/concise_patch.py -o /tmp/patch.py
          
          python /tmp/patch.py
          
          python -m compileall -q app analytics signal_engine integrations
          
          python -m pytest -q
          
          rm -f .github/workflows/apply-readiness-fix.yml
          
          git config user.name VIGNESH6579
          
          git config user.email VIGNESH6579@users.noreply.github.com
          
          git add app/main.py .github/workflows/apply-readiness-fix.yml
          
          git commit -m 'fix: report incomplete startup readiness and preserve live vwap fallback'
          
          git push origin main
          




















