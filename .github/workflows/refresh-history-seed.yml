name: Refresh public NSE history seed

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"

permissions:
  contents: write

jobs:
  refresh-history-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build F&O history seed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import timedelta
          from pathlib import Path
          import gzip
          import shutil
          import tempfile
          from app.market_calendar import recent_nse_trading_dates
          from collector.backfill import backfill_recent_bhavcopies
          from collector.index_backfill import backfill_index_bars
          from collector.universe import load_fno_universe
          from database.repository import SignalRepository
          from utils.time import now_ist

          root = Path.cwd()
          work = Path(tempfile.mkdtemp(prefix="nse-seed-"))
          db = work / "seed.sqlite3"
          repo = SignalRepository(db)
          symbols = set(load_fno_universe(force=True))
          if len(symbols) < 120:
              raise RuntimeError(f"F&O universe too small: {len(symbols)}")

          end = now_ist().date() - timedelta(days=1)
          result = backfill_recent_bhavcopies(
              repo,
              end_date=end,
              required_days=60,
              max_downloads=60,
              delay_seconds=1.0,
              symbols=symbols,
          )
          print("equity_seed", result, "symbols", len(symbols))

          index_result = backfill_index_bars(
              repo,
              days=60,
              max_downloads=4,
              angel_client=None,
          )
          print("index_seed", index_result)

          out = work / "seed_bhavcopy.sqlite3.gz"
          with open(db, "rb") as source, gzip.open(out, "wb", compresslevel=6) as target:
              shutil.copyfileobj(source, target)

          if out.stat().st_size > 10 * 1024 * 1024:
              raise RuntimeError(f"seed exceeds 10MB compressed cap: {out.stat().st_size}")

          target = Path("/tmp/seed_bhavcopy.sqlite3.gz")
          shutil.copy2(out, target)
          print("seed_bytes", target.stat().st_size)
          PY

      - name: Publish seed to data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf /tmp/data-worktree
          git worktree add --detach /tmp/data-worktree origin/data
          cp /tmp/seed_bhavcopy.sqlite3.gz /tmp/data-worktree/data/seed_bhavcopy.sqlite3.gz
          cd /tmp/data-worktree
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed_bhavcopy.sqlite3.gz
          if git diff --cached --quiet; then
            echo "History seed unchanged"
            exit 0
          fi
          git commit -m "data: refresh 60-day F&O history seed"
          git push origin HEAD:data
