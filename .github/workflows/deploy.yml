name: Deploy to Render



on:

  workflow_dispatch:
  
    inputs:
    
      force:
      
        description: 'Allow deployment during the market-hours safety window'
        
        required: false
        
        default: 'false'
        
        type: boolean
        


jobs:

  deploy:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Refuse market-hours deployment unless forced
      
        if: ${{ inputs.force != true }}
        
        shell: bash
        
        run: |
        
          hour=$(TZ=Asia/Kolkata date +%H)
          
          minute=$(TZ=Asia/Kolkata date +%M)
          
          weekday=$(TZ=Asia/Kolkata date +%u)
          
          now=$((10#$hour * 60 + 10#$minute))
          
          if [ "$weekday" -le 5 ] && [ "$now" -ge 540 ] && [ "$now" -le 945 ]; then
          
            echo "Refusing deployment between 09:00 and 15:45 IST on weekdays. Re-run with force=true only if intentional."
            
            exit 1
            
          fi
          
      - name: Trigger exactly one Render deployment
      
        env:
        
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          
        shell: bash
        
        run: |
        
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo 'RENDER_DEPLOY_HOOK_URL is not configured'; exit 1; }
          
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          





























