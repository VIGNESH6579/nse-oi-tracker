services:
  - type: web
    name: nse-oi-tracker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    # Deploy manually or outside market hours; a restart wipes free-tier SQLite.
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NSE_OI_POLL_INTERVAL_SECONDS
        value: "120"
      - key: NSE_OI_CACHE_TTL_SECONDS
        value: "60"
      - key: NSE_OI_HISTORY_RETENTION_DAYS
        value: "30"
      - key: NSE_OI_STARTUP_BACKFILL
        value: "1"
      - key: DEBUG_TOKEN
        generateValue: true
      - key: NSE_OI_AUTO_BACKFILL
        value: "1"
      - key: NSE_OI_INDEX_BACKFILL
        value: "1"
      # Configure these in Render's dashboard; never commit their values.
      - key: NSE_OI_BACKUP_URL
        sync: false
      - key: NSE_OI_BACKUP_TOKEN
        sync: false
      - key: NSE_OI_PROXY_URL
        sync: false
      # Add values later in Render; never commit credentials.
      - key: ANGEL_ONE_API_KEY
        sync: false
      - key: ANGEL_ONE_CLIENT_CODE
        sync: false
      - key: ANGEL_ONE_PASSWORD
        sync: false
      - key: ANGEL_ONE_TOTP_SECRET
        sync: false

# Render Free web services have an ephemeral filesystem. The app remains
# usable, but its local SQLite history resets on restart, redeploy, or idle
# spin-down. Use a paid disk or an external durable database before relying
# on history for production decisions.
