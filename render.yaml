services:
  - type: web
    name: nse-oi-tracker
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        value: ./data/news.db
      - key: POLL_INTERVAL_SECONDS
        value: "300"
      - key: NTFY_TOPIC
        sync: false
      - key: NTFY_TOKEN
        sync: false
      - key: FNO_SYMBOLS
        sync: false
      - key: FNO_FALLBACK_SYMBOLS
        sync: false
